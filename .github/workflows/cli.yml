name: CLI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'internal/dashboard/web/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'internal/dashboard/web/**'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go: '1.24.0'
          - runner: ubuntu-24.04
            go: '1.26.3'
          - runner: macos-15
            go: '1.26.3'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - run: make test vet

  binaries:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
      - run: make cross VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotagents-macos-linux
          path: |
            dist/dotagents-darwin-*
            dist/dotagents-linux-*
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
