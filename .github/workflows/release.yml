name: release

on:
  push:
    branches: [main]
    paths:
      - .skill-lock.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=$(.github/scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        run: .github/scripts/build-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            "dotagents-${VERSION}.tar.gz" \
            "skill-lock-${VERSION}.json" \
            --title "dotagents $VERSION" \
            --notes "Full ~/.agents snapshot: repo content + every skill resolved from .skill-lock.json at this commit. Extract at \$HOME to restore (\`tar xz -C \$HOME < dotagents-${VERSION}.tar.gz\`), then run ~/.agents/bin/setup."

      - name: Rewrite release notes with Claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .github/scripts/regenerate-notes.sh "${{ steps.version.outputs.version }}"
